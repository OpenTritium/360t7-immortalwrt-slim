name: release

# 自动 release。
#
# 触发：打 tag（v*）或手动。产物：两条线的 sysupgrade / initramfs（4 个镜像）
# + manifest + config.buildinfo + feeds.buildinfo + SHA256SUMS。
#
# 额外做一次「可复现性核对」：同一 REVISION 重建必须得到相同 sha256
# （两树均已验证位级可复现，见 mt798x-*/README-slim.txt）。
# 不一致说明构建环境混进了变量，release 失败 —— 把「确定性」当发布质量门用。
#
# ⚠️ 与 build.yml 同样：构建一律走 `just`，不在 YAML 里手写 docker run。
#    先 feeds、后注入 defconfig 种子的顺序只在 justfile 里维护。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 发布标签（如 v1.0.0）
        required: true

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.t.outputs.tag }}
      trees: ${{ steps.t.outputs.trees }}
    steps:
      - id: t
        run: |
          if [ '${{ github.event_name }}' = 'push' ]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi
          echo 'trees=["mt798x-6.6","mt798x-6.12"]' >> "$GITHUB_OUTPUT"

  # 先构建两次做位级比对，确认可复现后才进入正式出包。
  # 两树各自独立（fail-fast: false），一棵失败不影响另一棵的结论。
  reproducible:
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - tree: mt798x-6.6
            recipe: build66
          - tree: mt798x-6.12
            recipe: build612
    steps:
      - uses: actions/checkout@v7

      - name: 腾出磁盘
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      "$AGENT_TOOLSDIRECTORY" /usr/local/swift
          sudo apt-get clean
          df -h /

      - name: 安装 just
        uses: extractions/setup-just@v4

      - name: 缓存 dl
        uses: actions/cache@v6
        with:
          path: ${{ matrix.tree }}/dl
          key: dl-${{ matrix.tree }}-${{ hashFiles(format('{0}/feeds.conf.default', matrix.tree)) }}
          restore-keys: dl-${{ matrix.tree }}-

      - name: 构建构建器镜像
        run: just builder

      - name: 首次构建
        run: just ${{ matrix.recipe }}

      - name: 记录首次哈希
        run: |
          f=$(ls ${{ matrix.tree }}/bin/targets/mediatek/filogic/*sysupgrade*)
          sha256sum "$f" | tee /tmp/first.sha

      # 同一棵树、同一 REVISION 再建一次。幂等构建不会重编（make 判定无变化），
      # 因此这一步真正检验的是「从零重建是否得到同一结果」——
      # 故先删掉本次产物再重建。
      - name: 清理产物后重建（确定性核对）
        run: |
          just distclean ${{ matrix.tree }}
          just ${{ matrix.recipe }}
          f=$(ls ${{ matrix.tree }}/bin/targets/mediatek/filogic/*sysupgrade*)
          sha256sum -c /tmp/first.sha || {
            echo "::error::${{ matrix.tree }} 重建哈希与首次不一致——构建不可复现，拒绝发布"
            exit 1
          }

  release:
    needs: [prepare, reproducible]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - tree: mt798x-6.6
            recipe: build66
          - tree: mt798x-6.12
            recipe: build612
    steps:
      - uses: actions/checkout@v7

      - name: 腾出磁盘
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      "$AGENT_TOOLSDIRECTORY" /usr/local/swift
          sudo apt-get clean

      - name: 安装 just
        uses: extractions/setup-just@v4

      - uses: actions/cache@v6
        with:
          path: ${{ matrix.tree }}/dl
          key: dl-${{ matrix.tree }}-${{ hashFiles(format('{0}/feeds.conf.default', matrix.tree)) }}
          restore-keys: dl-${{ matrix.tree }}-

      - name: 构建构建器镜像
        run: just builder

      - name: 全量构建
        run: just ${{ matrix.recipe }}

      - name: 收集产物
        run: |
          T='${{ matrix.tree }}'
          D="$T/bin/targets/mediatek/filogic"
          mkdir -p "rel/$T"
          for pat in '*sysupgrade*' '*initramfs*' '*.manifest' 'config.buildinfo' 'feeds.buildinfo'; do
            cp -v $D/$pat "rel/$T/" 2>/dev/null || true
          done
          ( cd "rel/$T" && sha256sum -- * > SHA256SUMS && cat SHA256SUMS )

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.tree }}
          path: rel/${{ matrix.tree }}/
          if-no-files-found: error

  publish:
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: all
          merge-multiple: true

      - name: 汇总校验和
        run: |
          cd all
          find . -name SHA256SUMS -exec cat {} \; | sort -k2 > ALL-SHA256SUMS
          cat ALL-SHA256SUMS

      - name: 创建 Release
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          gh release create '${{ needs.prepare.outputs.tag }}' \
            --repo '${{ github.repository }}' \
            --title '${{ needs.prepare.outputs.tag }}' \
            --generate-notes \
            all/* || \
          gh release upload '${{ needs.prepare.outputs.tag }}' \
            --repo '${{ github.repository }}' all/* --clobber
