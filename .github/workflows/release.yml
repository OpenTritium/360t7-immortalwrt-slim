name: release

# 自动 release。
#
# 触发：打 tag（v*）或手动。产物：
#   - 两条线的 sysupgrade / initramfs（4 个镜像）+ manifest
#     + config.buildinfo + feeds.buildinfo + SHA256SUMS
#   - **社区 U-Boot**（设备实际运行的那个引导器，`uboot-revision` 钉死 commit）
#
# 为什么把社区 U-Boot 也放进 release：它按 `uboot-revision` 独立于固件版本，
# 但和固件同属「这台机器要用的东西」，放一起省得再去翻 workflow artifact。
#
# ⚠️ 别混淆两种 U-Boot：
#   release 里的 mt7981_360t7-*  = 社区 U-Boot（hanwckf/bl-mt798x）→ 可刷
#   固件构建顺带产出的 bl31-uboot.fip / preloader.bin
#                                = OpenWrt 主线 U-Boot + 官方 256M DDR3 时序
#                                  → 改装机（512M）刷了变砖，**故意不收录**。
#
# 额外做一次「可复现性核对」：同一 REVISION 重建必须得到相同 sha256
# （两树均已验证位级可复现，见 mt798x-*/README-slim.txt）。
# 不一致说明构建环境混进了变量，release 失败 —— 把「确定性」当发布质量门用。
#
# ⚠️ 与 build.yml 同样：构建一律走 `just`，不在 YAML 里手写 docker run。
#    先 feeds、后注入 defconfig 种子的顺序只在 justfile 里维护。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 发布标签（如 v1.0.0）
        required: true

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.t.outputs.tag }}
      trees: ${{ steps.t.outputs.trees }}
    steps:
      - id: t
        run: |
          if [ '${{ github.event_name }}' = 'push' ]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi
          echo 'trees=["mt798x-6.6","mt798x-6.12"]' >> "$GITHUB_OUTPUT"

  # 先构建两次做位级比对，确认可复现后才进入正式出包。
  # 两树各自独立（fail-fast: false），一棵失败不影响另一棵的结论。
  reproducible:
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - tree: mt798x-6.6
            recipe: build66
          - tree: mt798x-6.12
            recipe: build612
    steps:
      - uses: actions/checkout@v7

      - name: 腾出磁盘
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      "$AGENT_TOOLSDIRECTORY" /usr/local/swift
          sudo apt-get clean
          df -h /

      - name: 安装 just
        uses: extractions/setup-just@v4

      - name: 缓存 dl
        uses: actions/cache@v6
        with:
          path: ${{ matrix.tree }}/dl
          key: dl-${{ matrix.tree }}-${{ hashFiles(format('{0}/feeds.conf.default', matrix.tree)) }}
          restore-keys: dl-${{ matrix.tree }}-

      - name: 构建构建器镜像
        run: just builder

      - name: 首次构建
        run: just ${{ matrix.recipe }}

      - name: 记录首次哈希
        run: |
          f=$(ls ${{ matrix.tree }}/bin/targets/mediatek/filogic/*sysupgrade*)
          sha256sum "$f" | tee /tmp/first.sha

      # 同一棵树、同一 REVISION 再建一次。幂等构建不会重编（make 判定无变化），
      # 因此这一步真正检验的是「从零重建是否得到同一结果」——
      # 故先删掉本次产物再重建。
      - name: 清理产物后重建（确定性核对）
        run: |
          just distclean ${{ matrix.tree }}
          just ${{ matrix.recipe }}
          f=$(ls ${{ matrix.tree }}/bin/targets/mediatek/filogic/*sysupgrade*)
          sha256sum -c /tmp/first.sha || {
            echo "::error::${{ matrix.tree }} 重建哈希与首次不一致——构建不可复现，拒绝发布"
            exit 1
          }

  # 社区 U-Boot + ATF。它按 uboot-revision 独立，不受固件改动影响；
  # 放进 release 是为了「刷机要用的东西在一个地方拿全」。
  uboot:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: 腾出磁盘
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      "$AGENT_TOOLSDIRECTORY" /usr/local/swift
          sudo apt-get clean

      - name: 安装 just
        uses: extractions/setup-just@v4

      - name: 构建构建器镜像
        run: just builder

      - name: 取源码并构建 U-Boot + ATF
        run: just uboot

      - name: 收集产物
        run: |
          set -euo pipefail
          mkdir -p rel/uboot
          cp -v out/mt7981_360t7-* rel/uboot/
          cp -v uboot-revision rel/uboot/UPSTREAM-REVISION-PIN
          git -C bl-mt798x rev-parse HEAD > rel/uboot/UPSTREAM-COMMIT
          cat > rel/uboot/READ-ME-FIRST.txt <<'EOF'
          360T7M（改装 512M）用的社区 U-Boot + ATF，来源 hanwckf/bl-mt798x。
          对应上游 commit 见 UPSTREAM-COMMIT / UPSTREAM-REVISION-PIN。

          文件：
            mt7981_360t7-fip-fixed-parts.bin   FIP：BL31 + U-Boot —— 刷这个
            mt7981_360t7-bl2.bin               单独的 BL2（preloader 阶段）

          实测 FIP 的 TOC 只有两个组件（47d4086d…=BL31、d6d0eea7…=BL33/U-Boot），
          **不含 BL2**，所以 BL2 才单独出一个文件。正常刷写只需要 FIP。

          ⚠️ 这份 U-Boot 不是位级可复现的：BL31 与 U-Boot 的版本串里带构建时间
             （如 "Built : 11:15:31, Sep 16 2026"），同一 commit 在不同时间构建
             会有十几字节差异。要确认"是不是同一份"，看 UPSTREAM-COMMIT，
             别比哈希 —— 位级可复现只对固件（sysupgrade/initramfs）成立。

          刷写方法见 https://cmi.hanwckf.top/p/mt798x-uboot-usage

          ⚠️ 不要拿固件构建目录里顺带产出的 bl31-uboot.fip / preloader.bin 来刷。
             那是 OpenWrt 主线 U-Boot + 官方 256M DDR3 时序，改装机（512M）
             刷了会变砖。它们**故意没有**收录进本 release。

          ⚠️ 刷引导器风险远高于刷固件，写错即变砖。
          EOF
          ( cd rel/uboot && sha256sum -- * > SHA256SUMS && cat SHA256SUMS )

      - uses: actions/upload-artifact@v7
        with:
          name: release-uboot
          path: rel/uboot/
          if-no-files-found: error

  release:
    needs: [prepare, reproducible]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - tree: mt798x-6.6
            recipe: build66
          - tree: mt798x-6.12
            recipe: build612
    steps:
      - uses: actions/checkout@v7

      - name: 腾出磁盘
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      "$AGENT_TOOLSDIRECTORY" /usr/local/swift
          sudo apt-get clean

      - name: 安装 just
        uses: extractions/setup-just@v4

      - uses: actions/cache@v6
        with:
          path: ${{ matrix.tree }}/dl
          key: dl-${{ matrix.tree }}-${{ hashFiles(format('{0}/feeds.conf.default', matrix.tree)) }}
          restore-keys: dl-${{ matrix.tree }}-

      - name: 构建构建器镜像
        run: just builder

      - name: 全量构建
        run: just ${{ matrix.recipe }}

      - name: 收集产物
        run: |
          T='${{ matrix.tree }}'
          D="$T/bin/targets/mediatek/filogic"
          mkdir -p "rel/$T"
          for pat in '*sysupgrade*' '*initramfs*' '*.manifest' 'config.buildinfo' 'feeds.buildinfo'; do
            cp -v $D/$pat "rel/$T/" 2>/dev/null || true
          done
          ( cd "rel/$T" && sha256sum -- * > SHA256SUMS && cat SHA256SUMS )

      # 注意上传的是 rel/（不是 rel/$T/）：upload-artifact 会以「所有文件的
      # 最近公共祖先」为 artifact 根，这样 artifact 里保留 mt798x-6.6/ 这一层。
      # 若传 rel/$T/，两棵树的文件会被拍平到同一层，各自的 SHA256SUMS 互相覆盖
      # —— 下载端的 merge-multiple 会静默丢一份（这个 workflow 在修复前从未跑过）。
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.tree }}
          path: rel/
          if-no-files-found: error

  publish:
    # prepare 必须列进来：Actions 的 needs.<job> 只能取**直接依赖**的 output，
    # 只写 [release, uboot] 的话 needs.prepare.outputs.tag 会静默展开成空串
    # （release → prepare 只是传递依赖）→ gh release create "" 直接失败。
    needs: [prepare, release, uboot]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: all
          merge-multiple: true

      - name: 汇总校验和
        run: |
          set -euo pipefail
          cd all
          find . -type f -name SHA256SUMS -print0 | sort -z | xargs -0 cat > ALL-SHA256SUMS
          cat ALL-SHA256SUMS

      - name: 创建 Release
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          set -euo pipefail
          tag='${{ needs.prepare.outputs.tag }}'
          # merge-multiple 之后是目录树，gh 只收文件，这里显式展开
          mapfile -t files < <(find all -type f | sort)
          printf '%s\n' "${files[@]}"
          gh release create "$tag" \
            --repo '${{ github.repository }}' \
            --title "$tag" \
            --generate-notes \
            "${files[@]}" || \
          gh release upload "$tag" \
            --repo '${{ github.repository }}' "${files[@]}" --clobber
