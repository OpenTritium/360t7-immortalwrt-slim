name: build

# 新克隆（干净 runner）能否构建，是本仓库的核心不变量。
# 这条 workflow 也是另外两条自动化的构建门禁：
#   - upstream-sync：合并上游后必须仍能构建
#   - feeds-update：feed 升级后必须仍能构建
# GitHub 托管 runner 为 4 vCPU，全量构建约 2–4 小时，但要先腾出磁盘。
#
# ⚠️ 这里**必须**通过 `just` 调用构建，不要在 YAML 里手写 docker run。
#    曾经手写过一次，漏了「先 feeds、后注入 defconfig 种子」的顺序，
#    导致 make 因缺 .config 落进 menuconfig、在无 TTY 的 runner 上
#    报 "Error opening terminal: unknown" 而失败。
#    justfile 是唯一事实来源。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tree:
        description: 构建哪条线
        type: choice
        options: [mt798x-6.6, mt798x-6.12, both]
        default: both

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      trees: ${{ steps.set.outputs.trees }}
    steps:
      - id: set
        run: |
          case "${{ github.event.inputs.tree || 'both' }}" in
            both) echo 'trees=["mt798x-6.6","mt798x-6.12"]' >> "$GITHUB_OUTPUT" ;;
            *)    echo "trees=[\"${{ github.event.inputs.tree }}\"]" >> "$GITHUB_OUTPUT" ;;
          esac

  build:
    needs: matrix
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        tree: ${{ fromJSON(needs.matrix.outputs.trees) }}
        include:
          - tree: mt798x-6.6
            recipe: build66
          - tree: mt798x-6.12
            recipe: build612
    steps:
      - uses: actions/checkout@v7

      # GitHub 托管 runner 根分区约 14GB 可用，OpenWrt 全量构建不够用。
      # 删掉预装的大块头（Android SDK / .NET / Haskell / Swift 等），
      # 可腾出 ~25GB；不删工具链阶段就会磁盘写满。
      - name: 腾出磁盘
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      "$AGENT_TOOLSDIRECTORY" /usr/local/swift
          sudo apt-get clean
          df -h /

      - name: 安装 just
        uses: extractions/setup-just@v4

      # dl 缓存约 2GB/树，没有它每次都要重下内核 tarball（单棵树 140MB+）。
      # key 里带树名与 feeds.conf.default 的哈希：feed pin 一变即失效重建。
      - name: 缓存 dl
        uses: actions/cache@v6
        with:
          path: ${{ matrix.tree }}/dl
          key: dl-${{ matrix.tree }}-${{ hashFiles(format('{0}/feeds.conf.default', matrix.tree)) }}
          restore-keys: dl-${{ matrix.tree }}-

      # 用 justfile 里的镜像名构建，保证与 `just build*` 用的是同一个 tag。
      - name: 构建构建器镜像
        run: just builder

      - name: 全量构建 ${{ matrix.tree }}
        run: just ${{ matrix.recipe }}

      - name: 取产物与校验和
        run: |
          mkdir -p staging
          D=${{ matrix.tree }}/bin/targets/mediatek/filogic
          for pat in '*sysupgrade*' '*initramfs*' '*.manifest' 'config.buildinfo' 'feeds.buildinfo'; do
            cp -v $D/$pat staging/ 2>/dev/null || true
          done
          ( cd staging && sha256sum -- * > SHA256SUMS && cat SHA256SUMS )

      - uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.tree }}
          path: staging/
          if-no-files-found: error
          retention-days: 14
