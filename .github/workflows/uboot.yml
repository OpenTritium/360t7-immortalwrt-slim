name: uboot

# 构建（社区）U-Boot + ATF —— 设备实际运行的引导器，来源 hanwckf/bl-mt798x。
#
# 与 build.yml 的区别：那里建的是**固件**（含随固件打包、作备份用的主线 U-Boot），
# 这里建的是用于刷写设备的社区引导器。二者不是同一个东西，见 README「U-Boot」一节。
#
# ⚠️ 构建一律走 `just uboot`（justfile 是唯一事实来源）：
#    它负责按 uboot-revision 固定 commit、SOC/BOARD 参数，以及 ATF 需要的
#    python 软链（ATF 的 makeconfig 找的是 python 而非 python3，缺它时
#    defconfig 静默不生效、平台回落 fvp，最后报 fip build fail）。
#
# 触发：手动；或 uboot-revision / 构建器镜像变更时。

on:
  workflow_dispatch:
  push:
    paths:
      - 'uboot-revision'
      - '.github/workflows/uboot.yml'
      - 'docker/Dockerfile.builder'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: 安装 just
        uses: extractions/setup-just@v4

      - name: 构建构建器镜像
        run: just builder

      - name: 取源码并构建 U-Boot + ATF
        run: just uboot

      - name: 补一份上游 commit 记录
        run: |
          mkdir -p staging
          cp -v out/mt7981_360t7-* staging/
          short="$(git -C bl-mt798x rev-parse --short=8 HEAD)"
          echo "$short" > staging/UPSTREAM-COMMIT
          ( cd staging && sha256sum mt7981_360t7-* > SHA256SUMS && cat SHA256SUMS )
          echo "bl-mt798x @ $short"

      - uses: actions/upload-artifact@v7
        with:
          name: uboot-mt7981_360t7
          path: staging/
          if-no-files-found: error
          retention-days: 30
