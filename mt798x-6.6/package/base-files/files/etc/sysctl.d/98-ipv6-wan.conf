# WAN 接受上游 RA：accept_ra=2
#
# 内核在 net.ipv6.conf.all.forwarding=1 时会忽略 accept_ra=1，
# 必须用 2（转发开启时仍处理 RA），所以不能沿用默认的 0/1。
#
# 为什么需要：光猫路由模式 + 拿不到超级管理员密码 = 改不了桥接、要不到 PD。
# 此时 ISP 只经光猫的 RA 下发一个 /64，路由器必须先通过 RA 拿到上游地址
# 与默认路由，odhcpd 的 relay（见 /etc/uci-defaults/99-ipv6-passthrough）
# 才有东西可中继到 LAN；否则 LAN 侧怎么配都没有上游出口。
#
# 设备名 wan 是 mt7531 DSA 用户口的固定名字（board.d 02_network 的
# ucidef_set_interfaces_lan_wan "lan1 lan2 lan3" wan）。
# 设备后到时由 /etc/hotplug.d/net/00-sysctl 按 DEVICENAME 补应用；
# 设备不存在时 sysctl -e 静默跳过。
net.ipv6.conf.wan.accept_ra = 2
